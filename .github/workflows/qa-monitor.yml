name: Nightly QA Auto-Monitor

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm exec playwright -- install --with-deps chromium

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Execute QA Suite
        id: playwright_test
        run: |
          rm -rf allure-results allure-report
          npm exec playwright -- test
        continue-on-error: true

      - name: Load Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Build Allure Report
        id: build_allure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p allure-results allure-history

          if [ -d gh-pages-dir/history ]; then
            cp -R gh-pages-dir/history allure-results/
          fi

          npx --yes allure-commandline@2.44.0 generate allure-results \
            --clean \
            -o allure-history

      - name: Ensure Allure Pages content exists
        if: always()
        shell: bash
        run: |
          mkdir -p allure-history
          if [ ! -f allure-history/index.html ]; then
            cat > allure-history/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>QA Monitor</title></head>
            <body><h1>Allure report unavailable</h1><p>Report generation did not complete successfully.</p></body>
          </html>
          EOF
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: always()

      - name: Upload Pages Artifact
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-history

      - name: Deploy Health Dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        if: always() && steps.upload_pages.outcome == 'success'

      - name: Discord Alert on Failure
        if: always() && (steps.playwright_test.outcome == 'failure' || steps.build_allure.outcome == 'failure')
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK is not configured; skipping Discord alert."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚨 **QA Monitor: Test Failures Detected!** \nView Live Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\"}" \
               "$WEBHOOK_URL"

      - name: Mark workflow failed when QA or report generation fails
        if: always() && (steps.playwright_test.outcome == 'failure' || steps.build_allure.outcome == 'failure')
        run: exit 1
